pipeline.help.tooltip=流程如何运作
pipeline.help.title=流程如何运作
pipeline.help.body=以可视化方式构建工作流：\n\n• 从调色板拖动块到画布上。\n• “文件”块保存你的输入。从一个块的右侧端口拖到另一个块的左侧端口以连接它们。\n• 各块从左到右运行；链中最后一个块写出结果（一个文件，或当有多个时为一个文件夹）。\n• “合并”将其所有输入合并为一个 PDF。其他每个块都会单独处理每个输入文件。\n• 要移除连线，将鼠标悬停在上面并点击 ✕。\n\n当流程就绪后，按运行。
