pipeline.help.tooltip=Jak działają pipeline'y
pipeline.help.title=Jak działają pipeline'y
pipeline.help.body=Buduj przepływ wizualnie:\n\n• Przeciągaj klocki z palety na płótno.\n• Klocek „Pliki" zawiera wejście. Przeciągnij z prawego portu jednego klocka do lewego portu drugiego, aby je połączyć.\n• Klocki działają od lewej do prawej; ostatni w łańcuchu zapisuje wynik (plik lub folder, gdy jest ich wiele).\n• „Scal" łączy wszystkie wejścia w jeden PDF. Każdy inny klocek przetwarza każdy plik osobno.\n• Aby usunąć kabel, najedź na niego i kliknij ✕.\n\nGdy pipeline jest gotowy, naciśnij Uruchom.
