<header class="app-header">
  <a class="brand" routerLink="/" [attr.aria-label]="'header.brandHome' | transloco">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M6 2h8l4 4v16H6z M14 2v4h4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linejoin="round"
      />
      <path d="M9 12h6 M9 15h6 M9 18h4" fill="none" stroke="currentColor" stroke-width="1.6" />
    </svg>
    <span class="brand-name">PDF Conduit</span>
  </a>

  <div class="header-actions">
    @if (quota.remaining() !== null) {
      <a
        class="quota"
        [attr.data-state]="quotaState"
        routerLink="/"
        fragment="pro"
        [title]="
          (quotaState === 'spent' ? 'header.quotaTitleSpent' : 'header.quotaTitleLeft') | transloco
        "
      >
        <span class="quota-count">{{ quota.remaining() }}</span>
        <span class="quota-text">{{ 'header.quotaFreeLeft' | transloco }}</span>
      </a>
    }

    <span class="health" [attr.data-state]="health()" [title]="healthKey | transloco">
      <span class="dot" aria-hidden="true"></span>
      <span class="health-text">{{ healthKey | transloco }}</span>
    </span>

    <label class="lang-picker">
      <span class="sr-only">{{ 'header.languageLabel' | transloco }}</span>
      <svg class="lang-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M3 12h18 M12 3c3 3 3 15 0 18 M12 3c-3 3-3 15 0 18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
        />
      </svg>
      <select
        class="lang-select"
        [value]="language.active()"
        (change)="onLangChange($event)"
        [attr.aria-label]="'header.languageLabel' | transloco"
      >
        @for (lang of language.languages; track lang.code) {
          <option [value]="lang.code">{{ lang.name }}</option>
        }
      </select>
    </label>

    <button
      type="button"
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="
        (themeService.theme() === 'dark' ? 'header.themeToLight' : 'header.themeToDark') | transloco
      "
    >
      @if (themeService.theme() === 'dark') {
        <!-- sun -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path
            d="M12 2v2 M12 20v2 M2 12h2 M20 12h2 M5 5l1.5 1.5 M17.5 17.5 19 19 M19 5l-1.5 1.5 M6.5 17.5 5 19"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      } @else {
        <!-- moon -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
        </svg>
      }
    </button>
  </div>
</header>
