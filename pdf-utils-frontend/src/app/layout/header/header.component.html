<header class="app-header">
  <button
    #menuButton
    type="button"
    class="menu-toggle"
    (click)="menuToggle.emit()"
    [attr.aria-expanded]="menuOpen"
    aria-controls="app-sidebar"
    [attr.aria-label]="'nav.menuToggle' | transloco"
  >
    @if (menuOpen) {
      <!-- close (X) -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M6 6l12 12 M18 6 6 18"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    } @else {
      <!-- hamburger -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M4 7h16 M4 12h16 M4 17h16"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    }
  </button>

  <a class="brand" routerLink="/" [attr.aria-label]="'header.brandHome' | transloco">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M6 2h8l4 4v16H6z M14 2v4h4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linejoin="round"
      />
      <path d="M9 12h6 M9 15h6 M9 18h4" fill="none" stroke="currentColor" stroke-width="1.6" />
    </svg>
    <span class="brand-name">PDF Conduit</span>
  </a>

  <div class="header-actions">
    @if (quota.remaining() !== null) {
      <a
        class="quota"
        [attr.data-state]="quotaState"
        routerLink="/"
        fragment="pro"
        [title]="
          (quotaState === 'spent' ? 'header.quotaTitleSpent' : 'header.quotaTitleLeft') | transloco
        "
      >
        <span class="quota-count">{{ quota.remaining() }}</span>
        <span class="quota-text">{{ 'header.quotaFreeLeft' | transloco }}</span>
      </a>
    }

    <span class="health" [attr.data-state]="health()" [title]="healthKey | transloco">
      <span class="dot" aria-hidden="true"></span>
      <span class="health-text">{{ healthKey | transloco }}</span>
    </span>

    <label class="lang-picker">
      <span class="sr-only">{{ 'header.languageLabel' | transloco }}</span>
      <svg class="lang-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M3 12h18 M12 3c3 3 3 15 0 18 M12 3c-3 3-3 15 0 18"
          fill="none"
          stroke="currentColor"
          stroke-width="1.3"
          stroke-linecap="round"
        />
      </svg>
      <select
        class="lang-select"
        [value]="language.active()"
        (change)="onLangChange($event)"
        [attr.aria-label]="'header.languageLabel' | transloco"
      >
        @for (lang of language.languages; track lang.code) {
          <option [value]="lang.code">{{ lang.name }}</option>
        }
      </select>
    </label>

    <label class="theme-picker">
      <span class="sr-only">{{ 'theme.label' | transloco }}</span>
      <!-- palette / swatch icon -->
      <svg class="theme-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M12 3a9 9 0 1 0 0 18 2 2 0 0 0 2-2 2 2 0 0 1 2-2h1a4 4 0 0 0 4-4 9 9 0 0 0-9-8z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
        <circle cx="8" cy="10" r="1" fill="currentColor" />
        <circle cx="12" cy="7.5" r="1" fill="currentColor" />
        <circle cx="16" cy="10" r="1" fill="currentColor" />
      </svg>
      <select
        class="theme-select"
        [value]="themeService.theme()"
        (change)="onThemeChange($event)"
        [attr.aria-label]="'theme.label' | transloco"
      >
        @for (t of themeService.themes; track t) {
          <option [value]="t">{{ 'theme.name.' + t | transloco }}</option>
        }
      </select>
    </label>
  </div>
</header>
