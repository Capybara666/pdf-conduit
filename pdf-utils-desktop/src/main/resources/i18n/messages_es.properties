# Onboarding / tooltips (C4)
empty.files=Aún no hay archivos. Arrastra PDF, imágenes o documentos a la zona de arriba, o haz clic para elegir.
tooltip.dpi=Resolución en puntos por pulgada. Mayor = imágenes más nítidas, pero archivos más grandes. 150 sirve para casi todo; 300 para imprimir.
tooltip.quality=Calidad JPEG. Mayor conserva más detalle a costa de tamaño; menor ahorra espacio con más artefactos de compresión.
tooltip.compress.target=El tamaño de archivo objetivo. Conduit recodifica las imágenes lo justo para bajar de él, manteniendo la resolución cuando puede.
tooltip.opacity=Cuán transparente es la marca de agua. Más baja es más tenue, para no tapar el contenido de la página.
tooltip.metadata.strip=Elimina toda la información del documento (título, autor, asunto, palabras clave) en lugar de editarla.

