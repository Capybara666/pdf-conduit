# Onboarding / tooltips (C4)
empty.files=还没有文件。将 PDF、图片或文档拖到上方的拖放区，或点击选择。
tooltip.dpi=分辨率（每英寸点数）。越高图像越清晰，但文件越大。150 适合大多数用途；300 用于打印。
tooltip.quality=JPEG 质量。越高保留越多细节但文件更大；越低更省空间但压缩痕迹更多。
tooltip.compress.target=目标文件大小。Conduit 会恰好重新编码图像以降到该大小以下，并尽量保持分辨率。
tooltip.opacity=水印的透明程度。越低越淡，不会遮挡页面内容。
tooltip.metadata.strip=删除全部文档信息（标题、作者、主题、关键字），而不是编辑它们。
