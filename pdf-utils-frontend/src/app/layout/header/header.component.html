<header class="app-header">
  <!-- Inner content row: constrained to the same width/gutters as the page
       content column below (see .scss). The bar itself stays full-bleed. -->
  <div class="header-inner">
  <button
    #menuButton
    type="button"
    class="menu-toggle"
    (click)="menuToggle.emit()"
    [attr.aria-expanded]="menuOpen"
    aria-controls="app-sidebar"
    [attr.aria-label]="'nav.menuToggle' | transloco"
  >
    @if (menuOpen) {
      <!-- close (X) -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M6 6l12 12 M18 6 6 18"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    } @else {
      <!-- hamburger -->
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path
          d="M4 7h16 M4 12h16 M4 17h16"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </svg>
    }
  </button>

  <a class="brand" routerLink="/" [attr.aria-label]="'header.brandHome' | transloco">
    <svg
      class="logo"
      viewBox="0 0 24 24"
      aria-hidden="true"
      fill="none"
      stroke="currentColor"
      stroke-width="1.7"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <!-- Nodegraph mark: page-with-fold overlaid with a 3-node graph -->
      <path d="M6 3H14l4 4v14H6z" />
      <path d="M14 3v4h4" />
      <path d="M10.4 10.7l2.4 2.2" stroke-width="1.3" />
      <path d="M10.4 16.3l2.4-2.2" stroke-width="1.3" />
      <circle cx="9" cy="10" r="1.5" fill="currentColor" stroke="none" />
      <circle cx="9" cy="17" r="1.5" fill="currentColor" stroke="none" />
      <circle cx="14.2" cy="13.5" r="1.5" fill="currentColor" stroke="none" />
    </svg>
    <span class="brand-name">PDF Conduit</span>
  </a>

  <div class="header-actions">
    <span class="health" [attr.data-state]="health()" [title]="healthKey | transloco">
      <span class="dot" aria-hidden="true"></span>
      <span class="health-text">{{ healthKey | transloco }}</span>
    </span>

    @if (quota.remaining() !== null) {
      <a
        class="quota"
        [attr.data-state]="quotaState"
        routerLink="/"
        fragment="pro"
        [title]="
          (quotaState === 'spent' ? 'header.quotaTitleSpent' : 'header.quotaTitleLeft') | transloco
        "
      >
        <span class="quota-count">{{ quota.remaining() }}</span>
        <span class="quota-text">{{ 'header.quotaFreeLeft' | transloco }}</span>
      </a>
    }

    <a
      class="help-link"
      routerLink="/"
      fragment="how-it-works"
      [title]="'onboarding.helpTitle' | transloco"
    >
      <svg class="help-icon" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.5" />
        <path
          d="M9.2 9.2a2.8 2.8 0 1 1 3.9 2.6c-0.8 0.4-1.1 0.9-1.1 1.8"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
        />
        <circle cx="12" cy="16.5" r="0.9" fill="currentColor" />
      </svg>
      <span class="help-text">{{ 'onboarding.help' | transloco }}</span>
    </a>

    <div
      class="width-toggle"
      role="group"
      [attr.aria-label]="'width.label' | transloco"
      [title]="'width.label' | transloco"
    >
      <button
        type="button"
        class="width-btn"
        [class.active]="widthService.width() === 'fixed'"
        [attr.aria-pressed]="widthService.width() === 'fixed'"
        (click)="setWidth('fixed')"
        [attr.aria-label]="'width.fixed' | transloco"
        [title]="'width.fixed' | transloco"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect
            x="7"
            y="5"
            width="10"
            height="14"
            rx="1.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          />
        </svg>
        <span class="width-btn-text">{{ 'width.fixed' | transloco }}</span>
      </button>
      <button
        type="button"
        class="width-btn"
        [class.active]="widthService.width() === 'wide'"
        [attr.aria-pressed]="widthService.width() === 'wide'"
        (click)="setWidth('wide')"
        [attr.aria-label]="'width.wide' | transloco"
        [title]="'width.wide' | transloco"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect
            x="3"
            y="5"
            width="18"
            height="14"
            rx="1.5"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
          />
        </svg>
        <span class="width-btn-text">{{ 'width.wide' | transloco }}</span>
      </button>
    </div>

    <!-- Language + theme pickers. Hidden below the mobile breakpoint, where the
         gear button (next) opens the settings sheet instead, so the top bar
         stays a single, non-wrapping row. -->
    <app-secondary-controls class="header-secondary" />

    <!-- Mobile-only settings gear: opens the language + theme sheet. Hidden on
         desktop, where the pickers live inline in the header above. -->
    <button
      #gearButton
      type="button"
      class="settings-gear"
      (click)="openSettings()"
      [attr.aria-haspopup]="'dialog'"
      [attr.aria-expanded]="settingsOpen()"
      [attr.aria-label]="'header.settings' | transloco"
      [title]="'header.settings' | transloco"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <!-- Cog: perfectly rotationally-symmetric 8-tooth gear centered at
             (12,12), drawn as a light stroked outline (outer toothed ring +
             concentric center circle) to match the other header line icons. -->
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linejoin="round"
          stroke-linecap="round"
          d="M8.71 4.05 L9.53 1.28 L14.47 1.28 L15.29 4.05 L17.83 2.67 L21.33 6.17 L19.95 8.71 L22.72 9.53 L22.72 14.47 L19.95 15.29 L21.33 17.83 L17.83 21.33 L15.29 19.95 L14.47 22.72 L9.53 22.72 L8.71 19.95 L6.17 21.33 L2.67 17.83 L4.05 15.29 L1.28 14.47 L1.28 9.53 L4.05 8.71 L2.67 6.17 L6.17 2.67 Z M15.3 12 A3.3 3.3 0 1 0 8.7 12 A3.3 3.3 0 1 0 15.3 12 Z"
        />
      </svg>
    </button>
  </div>
  </div>

  @if (settingsOpen()) {
    <app-settings-modal (closed)="closeSettings()" />
  }
</header>
