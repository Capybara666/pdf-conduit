# PDF Conduit — web backend configuration (stateless, in-memory; no work directory).
# Every value is overridable via environment variables (Spring relaxed binding),
# e.g. SERVER_PORT, PDFCONDUIT_WEB_OFFICE_ENABLED, PDFCONDUIT_WEB_CORS_ALLOWED_ORIGINS.

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: pdf-conduit-web
  servlet:
    multipart:
      # Per-file and per-request upload limits. Raise for larger PDFs.
      max-file-size: ${PDFCONDUIT_WEB_MAX_FILE_SIZE:100MB}
      max-request-size: ${PDFCONDUIT_WEB_MAX_REQUEST_SIZE:200MB}

pdfconduit:
  web:
    # Optional explicit path to a LibreOffice `soffice` binary (office-doc conversion).
    # Leave blank to auto-detect. Absence only affects office inputs (.docx/.xlsx/...).
    soffice-path: ${PDFCONDUIT_WEB_SOFFICE_PATH:}
    # Guardrail: reject requests with more than this many uploaded files.
    max-files-per-request: ${PDFCONDUIT_WEB_MAX_FILES:50}
    # Office/document conversion is the sole disk exception (needs a per-request temp dir +
    # LibreOffice). Disable to reject office uploads (.docx/.xlsx/...) with a clear 415.
    office:
      enabled: ${PDFCONDUIT_WEB_OFFICE_ENABLED:true}
    # CORS: origins allowed to call /api/** (the Angular frontend). Comma-separated via env.
    cors:
      allowed-origins: ${PDFCONDUIT_WEB_CORS_ALLOWED_ORIGINS:http://localhost:4200}

logging:
  level:
    com.pdfconduit: INFO
