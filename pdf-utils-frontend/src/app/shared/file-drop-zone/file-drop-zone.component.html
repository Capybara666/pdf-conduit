<div
  class="dropzone"
  [ngClass]="{ dragging: dragging() }"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
>
  <label class="target">
    <input
      type="file"
      [multiple]="multiple"
      [accept]="accept"
      (change)="onSelect($event)"
      hidden
    />
    <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M12 16V4 M8 8l4-4 4 4 M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
    <span class="label">{{ label || ('dropzone.defaultLabel' | transloco) }}</span>
    @if (hint) {
      <span class="hint">{{ hint }}</span>
    }
  </label>
</div>

@if (showList && _files().length) {
  <ul class="file-list">
    @for (file of _files(); track $index) {
      <li class="file">
        <span class="name" [title]="file.name">{{ file.name }}</span>
        <span class="size">{{ formatBytes(file.size) }}</span>
        <button
          type="button"
          class="remove"
          (click)="remove($index)"
          [attr.aria-label]="'common.removeFile' | transloco: { name: file.name }"
        >
          ✕
        </button>
      </li>
    }
  </ul>
}
