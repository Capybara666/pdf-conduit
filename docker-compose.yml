# Docker Compose for the PDF Conduit web app (v2 — two containers).
#
# Architecture: an Angular single-page app served by nginx (the `frontend`
# service) which reverse-proxies /api to the stateless Spring Boot REST backend
# (the `backend` service). The backend processes uploads entirely in memory —
# there is NO work-dir volume anymore. The sole disk touch is office-document
# conversion, which the bundled headless LibreOffice performs in an isolated,
# immediately-deleted per-request temp dir (gated by PDFCONDUIT_WEB_OFFICE_ENABLED).
#
# Both images are BUILT FROM SOURCE here (not pre-published):
#   - backend  → pdf-utils-web/Dockerfile, context = repo root (needs the root
#                pom + pdf-utils-core alongside the module for the reactor build).
#   - frontend → pdf-utils-frontend/Dockerfile, context = pdf-utils-frontend
#                (its own npm build; not part of the Maven reactor).
#
#   Bring it up:   docker compose up --build
#   Then open:     http://localhost:${FRONTEND_PORT:-4200}
#
# Only the frontend publishes a host port; the browser talks to nginx, which
# proxies /api to the backend over the internal compose network. Because the
# SPA and the API share an origin (nginx), no CORS is needed in this topology —
# the backend's CORS allow-list matters only for the dev split-origin setup
# (ng serve on :4200 → backend on :8080). See .env.example.
#
# Configuration comes from environment variables (see .env.example). Copy that
# to `.env` to override defaults; Compose loads `.env` automatically.

services:
  backend:
    build:
      # Repo root as context so the reactor build sees the root pom + core.
      context: .
      dockerfile: pdf-utils-web/Dockerfile
    image: pdf-conduit-backend:1.0.0
    # No published port — reached only by the frontend over the compose network.
    # 8081 is the actuator/metrics management port: exposed on the internal compose
    # network only (for a sidecar/Prometheus scrape), NEVER published to the host.
    expose:
      - "8080"
      - "8081"
    environment:
      # Active Spring profile → which per-environment limit preset loads
      # (application-<profile>.yml). Base compose is local dev, so default to the
      # RELAXED `local` preset; the prod overlay forces `prod` (strict public).
      # Set SPRING_PROFILES_ACTIVE=dev to use the dev preset instead.
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-local}"
      # HTTP port inside the container (keep aligned with EXPOSE 8080).
      SERVER_PORT: "8080"
      # Internal-only management port for actuator (health/info/metrics/prometheus).
      # Do NOT map this to a host port — it must not be internet-reachable.
      MANAGEMENT_SERVER_PORT: "${MANAGEMENT_SERVER_PORT:-8081}"
      # JVM options. Default (set in the Dockerfile) makes the heap track the
      # container memory limit and exit on OOM so Docker restarts it. Override
      # here / via .env to pin a heap (e.g. "-Xmx1g -XX:+ExitOnOutOfMemoryError").
      JAVA_OPTS: "${JAVA_OPTS:--XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError}"
      # Optional explicit path to the `soffice` binary; the bundled LibreOffice
      # is auto-detected, so this is normally left empty.
      PDFCONDUIT_WEB_SOFFICE_PATH: "${PDFCONDUIT_WEB_SOFFICE_PATH:-}"
      # Office/document conversion (the sole disk exception). Set to false to
      # reject .docx/.xlsx/... uploads with a clear 415 instead.
      PDFCONDUIT_WEB_OFFICE_ENABLED: "${PDFCONDUIT_WEB_OFFICE_ENABLED:-true}"
      # OCR (scanned PDF → searchable PDF; tesseract + eng/pol/deu/fra/spa data
      # packs are baked into the image). Off by default — a production deploy
      # MUST set true in .env, otherwise the OCR page returns 415.
      PDFCONDUIT_WEB_OCR_ENABLED: "${PDFCONDUIT_WEB_OCR_ENABLED:-false}"
      # CORS allow-list for /api (comma-separated). Not needed for the nginx
      # same-origin proxy above, but harmless; matters for the dev split-origin.
      # In prod set this to your real https://DOMAIN (see .env.example).
      PDFCONDUIT_WEB_CORS_ALLOWED_ORIGINS: "${PDFCONDUIT_WEB_CORS_ALLOWED_ORIGINS:-http://localhost:4200}"
      # Upload guardrails.
      PDFCONDUIT_WEB_MAX_FILE_SIZE: "${PDFCONDUIT_WEB_MAX_FILE_SIZE:-100MB}"
      PDFCONDUIT_WEB_MAX_REQUEST_SIZE: "${PDFCONDUIT_WEB_MAX_REQUEST_SIZE:-200MB}"
      PDFCONDUIT_WEB_MAX_FILES: "${PDFCONDUIT_WEB_MAX_FILES:-50}"
      # --- Abuse protection (read by the backend; see .env.example) ----------
      # Per-IP request rate limiting.
      PDFCONDUIT_WEB_RATELIMIT_ENABLED: "${PDFCONDUIT_WEB_RATELIMIT_ENABLED:-true}"
      PDFCONDUIT_WEB_RATELIMIT_REQUESTS_PER_MINUTE: "${PDFCONDUIT_WEB_RATELIMIT_REQUESTS_PER_MINUTE:-40}"
      PDFCONDUIT_WEB_RATELIMIT_HEAVY_PER_MINUTE: "${PDFCONDUIT_WEB_RATELIMIT_HEAVY_PER_MINUTE:-10}"
      PDFCONDUIT_WEB_RATELIMIT_BURST: "${PDFCONDUIT_WEB_RATELIMIT_BURST:-15}"
      # Per-client daily quota / free-tier caps.
      PDFCONDUIT_WEB_QUOTA_ENABLED: "${PDFCONDUIT_WEB_QUOTA_ENABLED:-true}"
      PDFCONDUIT_WEB_QUOTA_DAILY_OPERATIONS: "${PDFCONDUIT_WEB_QUOTA_DAILY_OPERATIONS:-60}"
      PDFCONDUIT_WEB_QUOTA_FREE_MAX_FILE_SIZE: "${PDFCONDUIT_WEB_QUOTA_FREE_MAX_FILE_SIZE:-25MB}"
      PDFCONDUIT_WEB_QUOTA_FREE_MAX_FILES: "${PDFCONDUIT_WEB_QUOTA_FREE_MAX_FILES:-15}"
      # Concurrency / in-flight memory caps (the core anti-OOM guard).
      PDFCONDUIT_WEB_CONCURRENCY_MAX_HEAVY_OPS: "${PDFCONDUIT_WEB_CONCURRENCY_MAX_HEAVY_OPS:-4}"
      PDFCONDUIT_WEB_CONCURRENCY_MAX_IN_FLIGHT_BYTES: "${PDFCONDUIT_WEB_CONCURRENCY_MAX_IN_FLIGHT_BYTES:-536870912}"
      # Per-operation processing timeout + PDF page ceiling.
      PDFCONDUIT_WEB_PROCESSING_TIMEOUT_SECONDS: "${PDFCONDUIT_WEB_PROCESSING_TIMEOUT_SECONDS:-60}"
      PDFCONDUIT_WEB_PDF_MAX_PAGES: "${PDFCONDUIT_WEB_PDF_MAX_PAGES:-3000}"
      # LibreOffice conversion concurrency + timeout.
      PDFCONDUIT_WEB_OFFICE_MAX_CONCURRENT: "${PDFCONDUIT_WEB_OFFICE_MAX_CONCURRENT:-2}"
      PDFCONDUIT_WEB_OFFICE_TIMEOUT_SECONDS: "${PDFCONDUIT_WEB_OFFICE_TIMEOUT_SECONDS:-90}"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      # Mirrors the Dockerfile HEALTHCHECK; GET /api/health returns {status:"UP"}.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      # The Angular app builds itself (npm) and serves via nginx.
      context: pdf-utils-frontend
      dockerfile: Dockerfile
    image: pdf-conduit-frontend:1.0.0
    ports:
      # host:container — nginx listens on 80; publish it on the host. Change the
      # host side (FRONTEND_PORT) to relocate; keep it consistent with the docs.
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - backend
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
