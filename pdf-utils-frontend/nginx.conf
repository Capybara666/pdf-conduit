# nginx config for the PDF Conduit SPA + API reverse proxy.
#
# - Serves the built Angular app with history-API fallback to index.html.
# - Proxies /api/* to the Spring Boot backend (service name `backend` in
#   docker-compose; override by editing proxy_pass or via an upstream).
# - Hardened for public deployment: security headers, gzip, and edge
#   rate-limiting (defense-in-depth in front of the backend's own app-level
#   rate limiter / quotas / concurrency caps).
#
# This file is copied to /etc/nginx/conf.d/default.conf, which nginx includes
# INSIDE its stock `http {}` block — so the `limit_req_zone` / `limit_conn_zone`
# directives below (which are only valid in http context) belong here, ahead of
# the `server {}` block.

# Hide the nginx version in the Server header and error pages.
server_tokens off;

# ---------------------------------------------------------------------------
# Real client IP recovery. nginx sits BEHIND Caddy (prod TLS terminator), so the
# socket peer ($remote_addr) is Caddy — not the caller. Trust the compose/private
# subnets to set X-Forwarded-For and rewrite $remote_addr / $binary_remote_addr to
# the real client, so the rate-limit zones below key per actual client rather than
# collapsing every request onto Caddy's single IP.
#   set_real_ip_from lists the trusted upstream hops (edit to match your network).
#   real_ip_recursive on walks the XFF chain right-to-left, skipping trusted hops.
# ---------------------------------------------------------------------------
set_real_ip_from  127.0.0.1/32;
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  192.168.0.0/16;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# ---------------------------------------------------------------------------
# Rate-limiting zones (http context). Keyed on the real client IP (recovered above).
# ---------------------------------------------------------------------------
# General browsing/static traffic: fairly loose.
limit_req_zone  $binary_remote_addr  zone=general:10m  rate=30r/s;
# API traffic: tighter, since each call can trigger heavy PDF work.
limit_req_zone  $binary_remote_addr  zone=api:10m      rate=5r/s;
# Concurrent connections per client.
limit_conn_zone $binary_remote_addr  zone=perip:10m;

# Return 429 (not the default 503) when a request is rate-limited.
limit_req_status  429;
limit_conn_status 429;

# ---------------------------------------------------------------------------
# gzip for text-ish payloads (JS/CSS/JSON/SVG/...). Static JS/CSS also carry a
# long immutable cache below. Binary PDFs/images are already compressed, so they
# are left out of the gzip type list.
# ---------------------------------------------------------------------------
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/rss+xml
    application/manifest+json
    image/svg+xml
    font/ttf
    font/otf;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cap upload body size. Keep this >= the backend's max REQUEST size so nginx
    # doesn't reject an upload the backend would have accepted (413s should come
    # from the app, with its JSON error body).
    client_max_body_size 200m;

    # Per-IP concurrent connection cap (loose; browsers open several).
    limit_conn perip 50;

    # ---- Security headers (applied to every response) ----------------------
    # HSTS: only meaningful over HTTPS. Harmless on the internal plain hop
    # because Caddy terminates TLS at the edge; browsers only honour it when the
    # response was delivered over HTTPS. 1 year + preload-ready.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Content-Security-Policy tuned for an Angular SPA that renders PDFs with
    # pdf.js. Notes / caveats (VERIFY in a browser after any Angular upgrade):
    #   * script-src includes 'wasm-unsafe-eval' — pdf.js can use a WASM path.
    #   * worker-src 'self' blob: — pdf.js spins up its worker from a blob: URL.
    #   * 'unsafe-inline' on style-src — Angular injects component styles inline;
    #     removing it needs nonces/hashes and will break styling if dropped now.
    #   * img-src / font-src allow data: and blob: for inline/rendered assets.
    #   * connect-src 'self' covers the same-origin /api proxy.
    # This is deliberately "reasonable but not maximally strict"; tighten once
    # verified against the running app.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # index.html must NEVER be cached: after a redeploy a cached index would
    # point at fingerprinted bundles that no longer exist. The SPA fallback
    # below rewrites to /index.html, so this exact-match block serves it.
    location = /index.html {
        limit_req zone=general burst=40 nodelay;
        add_header Cache-Control "no-store" always;
        # NOTE: any add_header inside a location block OVERRIDES (drops) every
        # add_header inherited from server{} — a well-known nginx pitfall. So
        # every location that sets its own header must REPEAT all six security
        # headers below, exactly as declared in server{}. Same applies to the
        # static-asset blocks further down.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    # Fingerprinted assets (Angular hashes js/css/font filenames): cache hard.
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        limit_req zone=general burst=40 nodelay;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Security headers repeated — see the add_header pitfall note above.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # Images from public/ (favicon, og-image, apple-touch-icon, ...) are NOT
    # fingerprinted — a year-long immutable cache would pin stale graphics on
    # returning visitors. Short public cache instead.
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp)$ {
        limit_req zone=general burst=40 nodelay;
        expires 7d;
        add_header Cache-Control "public";
        # Security headers repeated — see the add_header pitfall note above.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # API reverse proxy → backend container.
    location /api/ {
        # Edge rate-limit: steady 5r/s with a burst cushion. The backend's own
        # limiter (PDFCONDUIT_WEB_RATELIMIT_*) is the precise, per-endpoint one;
        # this is a coarse flood guard so the backend is never even reached.
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Preserve the client IP chain + scheme so the backend's IP-based rate
        # limiter and quota logic see the real caller, not the nginx/Caddy hop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts: generous enough for slow LibreOffice office→PDF conversions
        # (backend PDFCONDUIT_WEB_OFFICE_TIMEOUT_SECONDS defaults to 90) plus
        # overhead, but tighter than the previous 300s to shed stuck requests.
        proxy_connect_timeout 10s;
        proxy_read_timeout  120s;
        proxy_send_timeout  120s;
        # Stream large PDF/ZIP responses without disk buffering.
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # SPA history fallback.
    location / {
        limit_req zone=general burst=40 nodelay;
        try_files $uri $uri/ /index.html;
    }
}
