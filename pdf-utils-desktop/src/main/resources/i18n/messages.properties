pipeline.help.body=Build a workflow visually:\n\n• Drag blocks from the palette onto the canvas.\n• A Files block holds your input. Drag from a block's right port to another block's left port to connect them.\n• Blocks run left → right; the last block in a chain writes the result (a file, or a folder when there are several).\n• Merge combines all its inputs into one PDF. Every other block processes each input file separately.\n• To remove a wire, hover it and click the ✕.\n\nWhen the pipeline is ready, press Run.
