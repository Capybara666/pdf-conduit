# PDF Conduit — web backend, LOCAL profile (RELAXED, frictionless local dev).
#
# Activate with SPRING_PROFILES_ACTIVE=local (see docker-compose.yml / .env.example).
# This profile RELAXES the strict public defaults from application.yml so a dev box
# never trips a size/count/rate/OOM guard while iterating. It is NOT for public use.
#
# It overrides ONLY the pdfconduit.web.* keys that should differ from the strict base
# default — everything else (ports, office toggle, CORS, trusted proxies, ...) still
# comes from application.yml. Each key stays env-overridable (an explicit env var wins
# over the profile value), so the derived var (e.g. PDFCONDUIT_WEB_QUOTA_FREE_MAX_FILE_SIZE)
# still trumps this file.
pdfconduit:
  web:
    # Accept many files per request (base default: 50).
    max-files-per-request: 500
    ratelimit:
      # Effectively out of the way for a single local developer (base: 40 / 10 / 15).
      requests-per-minute: 6000
      heavy-per-minute: 3000
      burst: 2000
    quota:
      # No practical daily ceiling + generous per-file/per-request caps
      # (base: 60 ops / 25MB / 15 files).
      daily-operations: 1000000
      free-max-file-size: 1GB
      free-max-files: 500
    concurrency:
      # Higher heavy-op parallelism + a 4 GiB in-flight ceiling (base: 4 / 512 MiB).
      max-heavy-ops: 32
      max-in-flight-bytes: 4294967296
    processing:
      # Longer per-op wall-clock so debugging/big inputs don't abort (base: 60s).
      timeout-seconds: 600
    pdf:
      # Allow very large PDFs locally (base: 3000).
      max-pages: 100000
    render:
      # Permit high-DPI / large-pixel renders locally (base: 300 dpi / 60 MP).
      max-dpi: 1200
      max-output-pixels: 500000000
