<header class="app-header">
  <a class="brand" routerLink="/" aria-label="PDF Conduit home">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
      <path
        d="M6 2h8l4 4v16H6z M14 2v4h4"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linejoin="round"
      />
      <path d="M9 12h6 M9 15h6 M9 18h4" fill="none" stroke="currentColor" stroke-width="1.6" />
    </svg>
    <span class="brand-name">PDF Conduit</span>
  </a>

  <div class="header-actions">
    <span class="health" [attr.data-state]="health()" [title]="healthLabel">
      <span class="dot" aria-hidden="true"></span>
      <span class="health-text">{{ healthLabel }}</span>
    </span>

    <button
      type="button"
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="
        themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'
      "
    >
      @if (themeService.theme() === 'dark') {
        <!-- sun -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6" />
          <path
            d="M12 2v2 M12 20v2 M2 12h2 M20 12h2 M5 5l1.5 1.5 M17.5 17.5 19 19 M19 5l-1.5 1.5 M6.5 17.5 5 19"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linecap="round"
          />
        </svg>
      } @else {
        <!-- moon -->
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"
            fill="none"
            stroke="currentColor"
            stroke-width="1.6"
            stroke-linejoin="round"
          />
        </svg>
      }
    </button>
  </div>
</header>
