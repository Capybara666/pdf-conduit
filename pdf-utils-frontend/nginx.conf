# nginx config for the PDF Conduit SPA + API reverse proxy.
#
# - Serves the built Angular app with history-API fallback to index.html.
# - Proxies /api/* to the Spring Boot backend (service name `backend` in
#   docker-compose; override by editing proxy_pass or via an upstream).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Large uploads (PDFs / batches). Keep aligned with the backend limits.
    client_max_body_size 200m;

    # Static assets: long cache for fingerprinted files.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # API reverse proxy → backend container.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SPA history fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
