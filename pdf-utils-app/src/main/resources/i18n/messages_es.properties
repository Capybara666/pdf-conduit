pipeline.empty.hint=Arrastra un bloque de la paleta de arriba al lienzo para empezar.\nConecta los bloques de izquierda a derecha; el último bloque guarda el resultado. Pulsa ? para ayuda.
pipeline.help.tooltip=Cómo funcionan los flujos
pipeline.help.title=Cómo funcionan los flujos
pipeline.help.body=Construye un flujo de trabajo visualmente:\n\n• Arrastra bloques de la paleta al lienzo.\n• Un bloque «Archivos» contiene la entrada. Arrastra desde el puerto derecho de un bloque al puerto izquierdo de otro para conectarlos.\n• Los bloques se ejecutan de izquierda a derecha; el último de una cadena escribe el resultado (un archivo, o una carpeta cuando hay varios).\n• «Combinar» une todas sus entradas en un solo PDF. Cualquier otro bloque procesa cada archivo de entrada por separado.\n• Para quitar una conexión, pasa el cursor por encima y haz clic en ✕.\n\nCuando el flujo esté listo, pulsa Ejecutar.
